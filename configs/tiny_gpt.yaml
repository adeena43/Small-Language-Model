# MiniGPT configuration. Every value can be overridden from the CLI:  --set model.n_layers=2 train.max_steps=500
seed: 1337

data:
  path: data/input.txt          # downloaded automatically if missing (Tiny Shakespeare)
  val_fraction: 0.1

model:
  context_length: 128
  d_model: 256
  n_heads: 4
  n_layers: 4
  ffn_dim: 1024                 # 4 x d_model
  dropout: 0.1
  pos_encoding: sinusoidal      # sinusoidal | learned
  weight_tying: false

train:
  optimizer: adamw
  lr: 0.0003                    # peak learning rate (3e-4)
  min_lr: 0.00003               # cosine decay floor
  warmup_steps: 100
  weight_decay: 0.01
  grad_clip: 1.0
  batch_size: 64
  max_steps: 5000
  eval_interval: 250
  eval_batches: 20
  log_interval: 50
  sample_interval: 1000
  sample_prompt: "ROMEO:"
  sample_tokens: 200
  device: auto                  # auto | cpu | cuda
  out_dir: outputs              # logs/figures/samples go under here
  checkpoint_dir: checkpoints

generate:
  temperature: 0.8
  max_new_tokens: 200
  top_k: null
  top_p: null
  fixed_prompts:
    - "ROMEO:"
    - "To be, or not to be"
    - "KING HENRY:\nWhat say you"
    - "The future of artificial intelligence"
    - "First Citizen:\nBefore we proceed"
